services:
  backend:
    build:
      context: ./backend
    container_name: sigma-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/qdrant_db:/app/qdrant_db
      - ./backend/.env:/app/.env:ro
      - fastembed_cache:/tmp/fastembed_cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: sigma-agent-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fastembed_cache:
